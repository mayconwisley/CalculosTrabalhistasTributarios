version: 2
updates:
  # As versões ficam centralizadas em Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        update-types: [minor, patch]
    # Os pacotes da Microsoft acompanham a versão do .NET: a versão principal só muda junto com o TargetFramework.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
