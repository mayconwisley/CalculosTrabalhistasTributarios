name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e testar
    # A interface é WPF e os testes usam net10.0-windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore CalculosTrabalhistasTributarios.Desktop.slnf

      - name: Compilar
        run: dotnet build CalculosTrabalhistasTributarios.Desktop.slnf -c Release --no-restore

      - name: Testar
        run: dotnet test CalculosTrabalhistasTributarios.Tests -c Release --no-build --report-xunit-trx --report-xunit-trx-filename resultados.trx --results-directory TestResults

      - name: Testar apresentação móvel sem emulador
        run: dotnet test CalculosTrabalhistasTributarios.Mobile.Tests -c Release --report-xunit-trx --report-xunit-trx-filename resultados-mobile.trx --results-directory TestResults

      - name: Guardar o resultado dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-dos-testes
          path: TestResults
