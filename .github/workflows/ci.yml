name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e testar
    # A interface é WPF e os testes usam net10.0-windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore CalculosTrabalhistasTributarios.Desktop.slnf

      - name: Compilar
        run: dotnet build CalculosTrabalhistasTributarios.Desktop.slnf -c Release --no-restore

      - name: Testar
        run: dotnet test CalculosTrabalhistasTributarios.Tests -c Release --no-build --report-xunit-trx --report-xunit-trx-filename resultados.trx --results-directory TestResults

      - name: Testar apresentação móvel sem emulador
        run: dotnet test CalculosTrabalhistasTributarios.Mobile.Tests -c Release --report-xunit-trx --report-xunit-trx-filename resultados-mobile.trx --results-directory TestResults

      - name: Guardar o resultado dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-dos-testes
          path: TestResults

  android:
    name: Compilar Android e validar interface
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'
      - name: Instalar workload Android
        run: dotnet workload install maui-android
      - name: Compilar APK isolado para testes
        run: >-
          dotnet build CalculosTrabalhistasTributarios.Mobile -c Release
          -p:ApplicationId=br.com.mayconwisley.calculostrabalhistastributarios.uitests
          -p:EmbedAssembliesIntoApk=true -p:AndroidPackageFormats=apk -p:RuntimeIdentifier=android-x64 -p:RunAOTCompilation=false
      # Configuração recomendada pela própria action: https://github.com/ReactiveCircus/android-emulator-runner
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar navegação, validação, rascunho e resultado
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 3072M
          enable-hw-keyboard: true
          disable-animations: true
          script: python3 tools/mobile-ui/smoke_android.py --apk CalculosTrabalhistasTributarios.Mobile/bin/Release/net10.0-android/android-x64/br.com.mayconwisley.calculostrabalhistastributarios.uitests-Signed.apk
      - name: Guardar evidências Android
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui
          path: TestResults/android-ui
