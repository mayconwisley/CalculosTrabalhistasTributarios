name: Problema
description: Erro de tela, relatório, instalação ou atualização das tabelas pela internet.
title: "[Problema] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Para valores calculados errados, use o modelo **Erro de cálculo**. Antes de abrir, confira as [mensagens comuns no manual](https://github.com/mayconwisley/CalculosTrabalhistasTributarios/blob/master/docs/MANUAL.md).
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
      description: Inclua a mensagem exibida, se houver.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra a tabela Seguro-desemprego
        2. Clique em Atualizar pela internet
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do aplicativo
      description: Aparece no rodapé da tela principal.
      placeholder: "1.6.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versão do Windows
      placeholder: "Windows 11 24H2"
    validations:
      required: false
  - type: textarea
    id: anexos
    attributes:
      label: Prints ou arquivos
      description: Arraste para cá prints da tela ou o PDF gerado. Remova dados pessoais antes de anexar.
    validations:
      required: false
